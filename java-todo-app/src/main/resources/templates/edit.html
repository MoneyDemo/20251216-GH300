<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit TODO - Java TODO App</title>
    <link rel="stylesheet" th:href="@{/css/tailwind-custom.css}">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="/" class="navbar-brand">
                <span>📝</span>
                <span>Java TODO App</span>
            </a>
            <div>
                <a href="/">My Tasks</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <div class="max-w-2xl">
            <!-- Card -->
            <div class="card">
                <!-- Header -->
                <div class="card-header bg-warning">
                    <h2 style="color: white; display: flex; align-items: center;">
                        <svg style="width: 1.75rem; height: 1.75rem; margin-right: 0.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Edit Task
                    </h2>
                </div>

                <!-- Form Body -->
                <div class="card-body">
                    <form th:action="@{/edit/{id}(id=${todo.id})}" th:object="${todo}" method="post">
                        <!-- Hidden Fields -->
                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{createdAt}">

                        <!-- Validation Errors -->
                        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger mb-4">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <div>
                                <h4>Please fix the following errors:</h4>
                                <ul style="list-style: disc; margin-left: 1.5rem; margin-top: 0.5rem;">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error message</li>
                                </ul>
                            </div>
                        </div>

                        <!-- Title Field -->
                        <div class="form-group">
                            <label for="title">
                                Title <span class="text-danger">*</span>
                            </label>
                            <input type="text" 
                                   id="title" 
                                   th:field="*{title}" 
                                   class="form-control"
                                   placeholder="Enter task title"
                                   required>
                            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger">Title error</p>
                        </div>

                        <!-- Description Field -->
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" 
                                      th:field="*{description}" 
                                      rows="4"
                                      class="form-control"
                                      placeholder="Enter task description (optional)"></textarea>
                            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="text-danger">Description error</p>
                        </div>

                        <!-- Completed Checkbox -->
                        <div class="form-check mb-6">
                            <input type="checkbox" 
                                   th:field="*{completed}" 
                                   id="completed">
                            <label for="completed">Mark as completed</label>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-4 pt-4">
                            <button type="submit" class="btn btn-warning">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/>
                                </svg>
                                Save Changes
                            </button>
                            <a href="/" class="btn btn-secondary">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                                </svg>
                                Back to List
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 - Java TODO App - A Simple TODO Management System with Tailwind CSS</p>
        </div>
    </footer>
</body>
</html>
